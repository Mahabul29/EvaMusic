<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1DB954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}EvaMusic{% endblock %}</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-color: #121212; --text-color: #ffffff; --text-secondary: #b3b3b3;
            --card-bg: #1e1e1e; --hover-bg: #2a2a2a; --border-color: #333;
            --accent-color: #1DB954; --nav-bg: #1a1a1a; --nav-active: #1DB954; --nav-inactive: #888;
            --player-bg: #181818; --player-height: 64px; --nav-height: 60px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color);
            min-height: 100vh;
            padding-bottom: calc(var(--player-height) + var(--nav-height) + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
        }

        /* ── Back Header (shown on sub-pages automatically) ── */
        .back-header {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            background: var(--bg-color);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }
        .back-header.visible { display: flex; }
        .back-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--card-bg);
            border: none;
            color: var(--text-color);
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .back-btn:active { background: var(--hover-bg); }
        .back-header-title {
            font-size: 17px;
            font-weight: 700;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 150px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 10px 20px; border-radius: 20px;
            font-size: 13px; font-weight: 500; color: white;
            z-index: 10000; opacity: 0; transition: all 0.3s ease;
            pointer-events: none; white-space: nowrap;
        }
        .toast-success { background: #1DB954; }
        .toast-error   { background: #ef4444; }
        .toast-info    { background: #3b82f6; }

        /* Bottom Mini Music Bar */
        .music-bar {
            position: fixed;
            bottom: var(--nav-height);
            left: 0; right: 0;
            height: var(--player-height);
            background: var(--player-bg);
            border-top: 1px solid #282828;
            display: flex; align-items: center;
            padding: 0 12px; gap: 12px;
            z-index: 300;
            transition: transform 0.3s ease;
        }
        .music-bar.hidden {
            transform: translateY(calc(100% + var(--nav-height)));
        }
        .music-bar-thumb {
            width: 44px; height: 44px; border-radius: 6px;
            object-fit: cover; flex-shrink: 0; cursor: pointer;
        }
        .music-bar-info {
            flex: 1; min-width: 0; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center;
        }
        .music-bar-title  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); }
        .music-bar-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-bar-btns   { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
        .music-bar-btn {
            background: none; border: none; color: var(--text-color);
            font-size: 18px; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: color 0.2s;
        }
        .music-bar-btn:active { color: var(--accent-color); }
        .music-bar-btn.play-btn { font-size: 22px; }
        .music-bar-progress {
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: #282828; cursor: pointer; z-index: 10;
        }
        .music-bar-progress-fill {
            height: 100%; width: 0%;
            background: var(--accent-color);
            transition: width 0.1s linear; pointer-events: none;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--nav-height);
            background: var(--nav-bg);
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            text-decoration: none;
            color: var(--nav-inactive);
            transition: color 0.2s;
            padding: 6px 0;
            -webkit-tap-highlight-color: transparent;
            min-width: 0;
        }
        .nav-item.active,
        .nav-item:active { color: var(--nav-active); }
        .nav-icon { font-size: 20px; line-height: 1; }
        .nav-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.1px;
            white-space: nowrap;
        }

        .nav-queue-badge {
            position: absolute;
            top: 2px;
            right: calc(50% - 18px);
            background: var(--accent-color);
            color: #000;
            font-size: 9px;
            font-weight: 700;
            min-width: 16px;
            height: 16px;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            line-height: 1;
        }
        .nav-queue-badge.show { display: flex; }

        /* Swipe-up arrow on mini bar */
        .music-bar-swipe-pill {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            height: auto;
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .music-bar-swipe-pill i {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.55);
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bottom-nav.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Back header — shown automatically on sub-pages via JS below -->
    <div class="back-header" id="backHeader">
        <button class="back-btn" id="backBtn" onclick="spaGoBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="back-header-title" id="backHeaderTitle"></div>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Mini Music Bar -->
    <div class="music-bar hidden" id="musicBar">
        <!-- ↑ Swipe-up arrow indicator at very top of bar -->
        <div class="music-bar-swipe-pill" id="musicBarSwipePill">
            <i class="fas fa-chevron-up"></i>
        </div>
        <div class="music-bar-progress" id="musicBarProgress" onclick="barSeek(event)">
            <div class="music-bar-progress-fill" id="musicBarProgressFill"></div>
        </div>
        <img src="/static/icon-512.png" alt=""
             class="music-bar-thumb" id="musicBarThumb"
             onclick="expandPlayer(event)">
        <div class="music-bar-info" onclick="expandPlayer(event)">
            <div class="music-bar-title"  id="musicBarTitle">Select a song</div>
            <div class="music-bar-artist" id="musicBarArtist">-</div>
        </div>
        <div class="music-bar-btns">
            <button class="music-bar-btn" onclick="barPrev()" title="Previous">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="music-bar-btn play-btn" onclick="barTogglePlay()" title="Play/Pause">
                <i class="fas fa-play" id="musicBarPlayIcon"></i>
            </button>
            <button class="music-bar-btn" onclick="barNext()" title="Next">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottomNav">
        <!-- CHANGED: fa-play-circle → fa-home, label Play → Home -->
        <a href="/home" class="nav-item" data-tab="play">
            <div class="nav-icon"><i class="fas fa-home"></i></div>
            <span class="nav-label">Home</span>
        </a>
        <a href="/search" class="nav-item" data-tab="search">
            <div class="nav-icon"><i class="fas fa-search"></i></div>
            <span class="nav-label">Search</span>
        </a>
        <a href="/profile" class="nav-item" data-tab="profile">
            <div class="nav-icon"><i class="fas fa-user"></i></div>
            <span class="nav-label">Profile</span>
        </a>
        <a href="/settings" class="nav-item" data-tab="settings">
            <div class="nav-icon"><i class="fas fa-cog"></i></div>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

    <!-- Load order: player engine -> SPA nav -> bottom nav -> profile page handlers -->
    <script src="{{ url_for('static', filename='js/pullup-player.js') }}"></script>
    <script src="{{ url_for('static', filename='js/player-animation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/spa-nav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bottom-nav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recommended-artists.js') }}"></script>

    <script>
    // ── Sub-page back header logic ────────────────────────────────────────────
    // Pages under /profile (favorites, history, playlists, playlist/*)
    // show a back arrow that returns to /profile.
    // Add any other sub-page paths to SUB_PAGES as needed.

    const SUB_PAGES = {
        '/favorites':  { title: 'My Favorites',       back: '/profile' },
        '/history':    { title: 'Listening History',   back: '/profile' },
        '/playlists':  { title: 'My Playlists',        back: '/profile' },
        '/profile/edit': { title: 'Edit Profile',      back: '/profile' },
    };

    // Also match dynamic routes like /playlist/xyz
    function _getSubPage(path) {
        if (SUB_PAGES[path]) return SUB_PAGES[path];
        if (path.startsWith('/playlist/')) return { title: 'Playlist', back: '/playlists' };
        return null;
    }

    function _updateBackHeader(path) {
        const header = document.getElementById('backHeader');
        const titleEl = document.getElementById('backHeaderTitle');
        if (!header || !titleEl) return;
        const sub = _getSubPage(path);
        if (sub) {
            titleEl.textContent = sub.title;
            header.dataset.backUrl = sub.back;
            header.classList.add('visible');
        } else {
            header.classList.remove('visible');
            header.dataset.backUrl = '';
        }
    }

    function spaGoBack() {
        const header = document.getElementById('backHeader');
        const backUrl = header && header.dataset.backUrl;
        if (backUrl) {
            // Use SPA nav if available, else hard nav
            if (window._spaNavigateTo) window._spaNavigateTo(backUrl);
            else window.location.href = backUrl;
        } else {
            history.back();
        }
    }

    // Run on initial page load
    _updateBackHeader(window.location.pathname);

    // Re-run after every SPA swap (spa-nav.js fires this custom event)
    document.addEventListener('spa:navigated', function(e) {
        _updateBackHeader(e.detail && e.detail.url ? e.detail.url.split('?')[0] : window.location.pathname);
    });
    </script>

    {% block extra_js %}{% endblock %}
</body>
            </html>
