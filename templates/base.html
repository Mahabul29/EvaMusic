<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1DB954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}EvaMusic{% endblock %}</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo/icon-192x192.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-color: #121212; --text-color: #ffffff; --text-secondary: #b3b3b3;
            --card-bg: #1e1e1e; --hover-bg: #2a2a2a; --border-color: #333;
            --accent-color: #1DB954; --nav-bg: #1a1a1a; --nav-active: #1DB954; --nav-inactive: #888;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color);
            min-height: 100vh; padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden;
        }
        .toast {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 24px; border-radius: 24px;
            font-size: 14px; font-weight: 500; color: white;
            z-index: 1000; opacity: 0; transition: all 0.3s ease;
            pointer-events: none; white-space: nowrap;
        }
        .toast-success { background: #1DB954; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bottom-nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pullup-player.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <div class="mini-player" id="miniPlayer">
        <img src="/static/images/default-album.png" alt="" class="mini-player-thumb" id="miniThumb">
        <div class="mini-player-info">
            <div class="mini-player-title" id="miniTitle">Select a song</div>
            <div class="mini-player-artist" id="miniArtist">-</div>
        </div>
        <div class="mini-player-controls">
            <button class="mini-player-btn" onclick="event.stopPropagation(); previousSong()">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="mini-player-btn play-btn" onclick="event.stopPropagation(); togglePlay()">
                <i class="fas fa-play play-icon"></i>
            </button>
            <button class="mini-player-btn" onclick="event.stopPropagation(); nextSong()">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
    </div>

    <div class="full-player" id="fullPlayer">
        <div class="swipe-indicator"></div>
        <div class="full-player-header">
            <button class="down-btn" onclick="collapsePlayer()">
                <i class="fas fa-chevron-down"></i>
            </button>
            <h3>Now Playing</h3>
            <button class="queue-btn" onclick="showToast('Queue coming soon!', 'info')">
                <i class="fas fa-list-ul"></i>
            </button>
        </div>
        <div class="full-player-content">
            <div class="full-player-artwork" id="fullArtwork">
                <img src="/static/images/default-album.png" alt="" id="fullThumb">
                <div class="vinyl-disc"></div>
            </div>
            <div class="full-player-details">
                <div class="full-player-title" id="fullTitle">Select a song</div>
                <div class="full-player-artist" id="fullArtist">-</div>
            </div>
        </div>
        <div class="progress-section">
            <div class="progress-bar-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        <div class="full-player-controls">
            <button class="control-btn shuffle-btn" onclick="toggleShuffle()">
                <i class="fas fa-random"></i>
            </button>
            <button class="control-btn prev-btn" onclick="previousSong()">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="control-btn play-pause-btn" onclick="togglePlay()">
                <i class="fas fa-play play-icon"></i>
            </button>
            <button class="control-btn next-btn" onclick="nextSong()">
                <i class="fas fa-step-forward"></i>
            </button>
            <button class="control-btn repeat-btn" onclick="toggleRepeat()">
                <i class="fas fa-repeat"></i>
            </button>
        </div>
        <div class="full-player-extras">
            <button class="extra-btn" onclick="toggleFavorite()">
                <i class="far fa-heart"></i><span>Like</span>
            </button>
            <button class="extra-btn" onclick="shareSong()">
                <i class="fas fa-share-alt"></i><span>Share</span>
            </button>
            <button class="extra-btn" onclick="showToast('Download coming soon!', 'info')">
                <i class="fas fa-download"></i><span>Download</span>
            </button>
            <button class="extra-btn" onclick="showToast('Lyrics coming soon!', 'info')">
                <i class="fas fa-align-center"></i><span>Lyrics</span>
            </button>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <a href="/home" class="nav-item {% if request.path == '/home' or request.path == '/' %}active{% endif %}" data-tab="play">
            <div class="nav-icon"><i class="fas fa-play-circle"></i></div>
            <span class="nav-label">Play</span>
        </a>
        <a href="/search" class="nav-item {% if request.path == '/search' %}active{% endif %}" data-tab="search">
            <div class="nav-icon"><i class="fas fa-search"></i></div>
            <span class="nav-label">Search</span>
        </a>
        <a href="/profile" class="nav-item {% if request.path.startswith('/profile') %}active{% endif %}" data-tab="profile">
            <div class="nav-icon"><i class="fas fa-user"></i></div>
            <span class="nav-label">Profile</span>
        </a>
        <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}" data-tab="settings">
            <div class="nav-icon"><i class="fas fa-cog"></i></div>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

    <script>
        // Prevent bfcache issues - force reload on back navigation
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });
    </script>
    <script src="{{ url_for('static', filename='js/bottom-nav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pullup-player.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
                    </html>
