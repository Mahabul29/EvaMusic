<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1DB954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}EvaMusic{% endblock %}</title>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo/icon-192x192.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-color: #121212; --text-color: #ffffff; --text-secondary: #b3b3b3;
            --card-bg: #1e1e1e; --hover-bg: #2a2a2a; --border-color: #333;
            --accent-color: #1DB954; --nav-bg: #1a1a1a; --nav-active: #1DB954; --nav-inactive: #888;
            --player-bg: #181818; --player-height: 64px; --nav-height: 60px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color);
            min-height: 100vh;
            /* space for: mini player bar + bottom nav + safe area */
            padding-bottom: calc(var(--player-height) + var(--nav-height) + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
        }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 150px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 10px 20px; border-radius: 20px;
            font-size: 13px; font-weight: 500; color: white;
            z-index: 10000; opacity: 0; transition: all 0.3s ease;
            pointer-events: none; white-space: nowrap;
        }
        .toast-success { background: #1DB954; }
        .toast-error   { background: #ef4444; }
        .toast-info    { background: #3b82f6; }

        /* ── Bottom Mini Music Bar ── */
        .music-bar {
            position: fixed;
            bottom: var(--nav-height);   /* sits directly above the bottom nav */
            left: 0; right: 0;
            height: var(--player-height);
            background: var(--player-bg);
            border-top: 1px solid #282828;
            display: flex; align-items: center;
            padding: 0 12px; gap: 12px;
            z-index: 300;               /* above nav (z-index 200) */
            transition: transform 0.3s ease;
        }
        /* hidden = slide below nav entirely */
        .music-bar.hidden {
            transform: translateY(calc(100% + var(--nav-height)));
        }
        .music-bar-thumb {
            width: 44px; height: 44px; border-radius: 6px;
            object-fit: cover; flex-shrink: 0; cursor: pointer;
        }
        .music-bar-info {
            flex: 1; min-width: 0; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center;
        }
        .music-bar-title  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); }
        .music-bar-artist { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-bar-btns   { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
        .music-bar-btn {
            background: none; border: none; color: var(--text-color);
            font-size: 18px; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: color 0.2s;
        }
        .music-bar-btn:active { color: var(--accent-color); }
        .music-bar-btn.play-btn { font-size: 22px; }
        .music-bar-progress {
            position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: #282828; cursor: pointer; z-index: 10;
        }
        .music-bar-progress-fill {
            height: 100%; width: 0%;
            background: var(--accent-color);
            transition: width 0.1s linear; pointer-events: none;
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bottom-nav.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- ═══ Bottom Mini Music Bar — outside .main-content so SPA nav never destroys it ═══ -->
    <div class="music-bar hidden" id="musicBar">
        <div class="music-bar-progress" id="musicBarProgress" onclick="barSeek(event)">
            <div class="music-bar-progress-fill" id="musicBarProgressFill"></div>
        </div>
        <img src="/static/images/default-album.png" alt=""
             class="music-bar-thumb" id="musicBarThumb"
             onclick="expandPlayer(event)">
        <div class="music-bar-info" onclick="expandPlayer(event)">
            <div class="music-bar-title"  id="musicBarTitle">Select a song</div>
            <div class="music-bar-artist" id="musicBarArtist">-</div>
        </div>
        <div class="music-bar-btns">
            <button class="music-bar-btn" onclick="barPrev()" title="Previous">
                <i class="fas fa-step-backward"></i>
            </button>
            <button class="music-bar-btn play-btn" onclick="barTogglePlay()" title="Play/Pause">
                <i class="fas fa-play" id="musicBarPlayIcon"></i>
            </button>
            <button class="music-bar-btn" onclick="barNext()" title="Next">
                <i class="fas fa-step-forward"></i>
            </button>
        </div>
    </div>

    <!-- ═══ Bottom Nav ═══ -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="/home" class="nav-item" data-tab="play">
            <div class="nav-icon"><i class="fas fa-play-circle"></i></div>
            <span class="nav-label">Play</span>
        </a>
        <a href="/search" class="nav-item" data-tab="search">
            <div class="nav-icon"><i class="fas fa-search"></i></div>
            <span class="nav-label">Search</span>
        </a>
        <a href="/profile" class="nav-item" data-tab="profile">
            <div class="nav-icon"><i class="fas fa-user"></i></div>
            <span class="nav-label">Profile</span>
        </a>
        <a href="/settings" class="nav-item" data-tab="settings">
            <div class="nav-icon"><i class="fas fa-cog"></i></div>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

    <!-- Load order: player engine → SPA nav → bottom nav → page scripts -->
    <script src="{{ url_for('static', filename='js/pullup-player.js') }}"></script>
    <script src="{{ url_for('static', filename='js/spa-nav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bottom-nav.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
            </html>
