<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | JioSaavn Music</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/player.css">
    <link rel="stylesheet" href="/static/css/dark-theme.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">
            <img src="/static/images/logo.png" alt="Logo" class="nav-logo">
            <span class="brand-name">JioSaavn</span>
        </div>
        <div class="nav-search">
            <form action="/search" method="GET">
                <input type="text" name="q" placeholder="Search songs, artists..." value="{{ request.args.get('q', '') }}">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
        <div class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}"><i class="fas fa-home"></i> Home</a>
            <a href="/trending" class="{% if request.path == '/trending' %}active{% endif %}"><i class="fas fa-fire"></i> Trending</a>
            <a href="/library" class="{% if request.path == '/library' %}active{% endif %}"><i class="fas fa-heart"></i> Library</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Player Bar -->
    <div class="player-bar" id="playerBar">
        <div class="player-info">
            <img src="/static/images/default-album.png" alt="Album" class="player-thumb" id="playerThumb">
            <div class="player-meta">
                <span class="player-title" id="playerTitle">Select a song</span>
                <span class="player-artist" id="playerArtist">--</span>
            </div>
        </div>
        <div class="player-controls">
            <button id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
        <div class="player-progress">
            <span id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span id="duration">0:00</span>
        </div>
        <div class="player-volume">
            <i class="fas fa-volume-up"></i>
            <input type="range" min="0" max="100" value="80" id="volumeSlider">
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/player.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
