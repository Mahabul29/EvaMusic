<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1DB954">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}EvaMusic{% endblock %}</title>

    <!-- PWA -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo/icon-192x192.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Base Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --card-bg: #1e1e1e;
            --hover-bg: #2a2a2a;
            --border-color: #333;
            --accent-color: #1DB954;
            --nav-bg: #1a1a1a;
            --nav-active: #1DB954;
            --nav-inactive: #888;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-success { background: #1DB954; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
    </style>

    <!-- Bottom Nav CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bottom-nav.css') }}">

    {% block extra_css %}{% endblock %}

    <!-- Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/static/sw/service-worker.js')
                .then(reg => console.log('[SW] Registered'))
                .catch(err => console.log('[SW] Failed:', err));
        });
    }
    </script>
</head>
<body>
    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="/home" class="nav-item {% if request.path == '/home' or request.path == '/' %}active{% endif %}" data-tab="play">
            <div class="nav-icon"><i class="fas fa-play-circle"></i></div>
            <span class="nav-label">Play</span>
        </a>
        <a href="/search" class="nav-item {% if request.path == '/search' %}active{% endif %}" data-tab="search">
            <div class="nav-icon"><i class="fas fa-search"></i></div>
            <span class="nav-label">Search</span>
        </a>
        <a href="/profile" class="nav-item {% if request.path.startswith('/profile') %}active{% endif %}" data-tab="profile">
            <div class="nav-icon"><i class="fas fa-user"></i></div>
            <span class="nav-label">Profile</span>
        </a>
        <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}" data-tab="settings">
            <div class="nav-icon"><i class="fas fa-cog"></i></div>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/bottom-nav.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
