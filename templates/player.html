{% extends "base.html" %}
{% block title %}{{ song.title }} - {{ song.artist }}{% endblock %}

{% block extra_js %}
<script>
// ─────────────────────────────────────────────────────────────────────────────
// player.html — This page is visited via direct URL (e.g. share link).
// It loads the song data from the server, starts playing if nothing is
// already playing, then immediately opens the overlay so the user sees the
// full-screen player without losing any audio.
// ─────────────────────────────────────────────────────────────────────────────

const SONG_DATA = {{ song | tojson }};

window.addEventListener('load', function () {

    const p = window.player;   // EvaPlayer singleton from pullup-player.js

    const isSameSong = p.currentSong &&
        (p.getId(p.currentSong) === (SONG_DATA.id || SONG_DATA.song_id));

    if (!isSameSong) {
        // Fresh visit — start playing this song
        p.playSong(SONG_DATA.id || SONG_DATA.song_id, SONG_DATA);
    }

    // Always open the overlay so the user sees the player UI
    openPlayerOverlay(p.currentSong || SONG_DATA);
});
</script>
{% endblock %}

{% block content %}
{# Minimal fallback content — user will immediately see the overlay #}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;color:#b3b3b3;font-size:14px;">
    <span>Loading player…</span>
</div>
{% endblock %}
