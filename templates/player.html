<script>
const SONG_DATA = {{ song|tojson }};

// ── Hook into global _eva engine ──────────────────────────────
window._npUpdatePlayBtn = (playing) => {
    const icon = document.getElementById('npPlayIcon');
    if (icon) icon.className = playing ? 'fas fa-pause' : 'fas fa-play';
};

window._npUpdateSongUI = (songData) => {
    document.getElementById('npSongTitle').textContent  = songData.title  || '';
    document.getElementById('npSongArtist').textContent = songData.artist || '';
    document.getElementById('npAlbumArt').src = songData.image || '/static/images/default-album.png';
    document.getElementById('npBg').style.backgroundImage = `url('${songData.image || ""}')`;
    const label = document.getElementById('npArtistLabel');
    const link  = document.getElementById('npViewArtist');
    if (label) label.textContent = songData.artist || 'Artist';
    if (link)  link.href = `/search?q=${encodeURIComponent(songData.artist || '')}`;
};

window._npOnTimeUpdate = (currentTime, duration) => {
    if (window._seekTouching) return;
    const pct = (currentTime / duration) * 100;
    document.getElementById('npProgressFill').style.width = pct + '%';
    document.getElementById('npProgressThumb').style.left  = pct + '%';
    document.getElementById('npCurrentTime').textContent = _fmt(currentTime);
    document.getElementById('npTotalTime').textContent   = _fmt(duration);
};

window._npSetSong = (songData) => {
    window._npUpdateSongUI(songData);
    checkFavoriteState(songData.id);
};

function _fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
}

// ── Controls (delegate to global engine) ─────────────────────
function togglePlay()   { barTogglePlay(); }
function nextSong()     { barNext(); }
function previousSong() { barPrev(); }

function toggleShuffle() {
    window._eva.isShuffle = !window._eva.isShuffle;
    const btn = document.getElementById('npShuffleBtn');
    btn?.classList.toggle('active', window._eva.isShuffle);
    showToast(window._eva.isShuffle ? 'Shuffle on' : 'Shuffle off', 'info');
}

function toggleRepeat() {
    window._eva.repeatMode = (window._eva.repeatMode + 1) % 3;
    const btn  = document.getElementById('npRepeatBtn');
    const icon = btn?.querySelector('i');
    const modes = ['Repeat off', 'Repeat all', 'Repeat one'];
    showToast(modes[window._eva.repeatMode], 'info');
    btn?.classList.toggle('active', window._eva.repeatMode > 0);
    if (icon) icon.className = window._eva.repeatMode === 2 ? 'fas fa-redo-alt' : 'fas fa-redo';
}

// ── Seek ──────────────────────────────────────────────────────
window._seekTouching = false;

function seekNP(e) {
    const audio = window._eva.audio;
    if (!audio || !audio.duration) return;
    const bar  = document.getElementById('npProgressBar');
    const rect = bar.getBoundingClientRect();
    const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
}
function startSeekTouch(e) { window._seekTouching = true; seekTouch(e); }
function seekTouch(e) {
    if (!window._seekTouching) return;
    e.preventDefault();
    const audio = window._eva.audio;
    if (!audio || !audio.duration) return;
    const bar   = document.getElementById('npProgressBar');
    const rect  = bar.getBoundingClientRect();
    const touch = e.touches[0];
    const pct   = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
    document.getElementById('npProgressFill').style.width = (pct*100) + '%';
    document.getElementById('npProgressThumb').style.left  = (pct*100) + '%';
    document.getElementById('npCurrentTime').textContent = _fmt(pct * audio.duration);
}
function endSeekTouch(e) {
    const audio = window._eva.audio;
    if (!audio || !audio.duration) return;
    const bar   = document.getElementById('npProgressBar');
    const rect  = bar.getBoundingClientRect();
    const touch = e.changedTouches[0];
    const pct   = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
    audio.currentTime = pct * audio.duration;
    window._seekTouching = false;
}

// ── Favorite ─────────────────────────────────────────────────
async function checkFavoriteState(songId) {
    try {
        const res  = await fetch('/api/favorites');
        const favs = await res.json();
        const liked = favs.some(f => f.song_id === songId);
        const btn  = document.getElementById('npLikeBtn');
        const icon = btn?.querySelector('i');
        btn?.classList.toggle('liked', liked);
        if (icon) icon.className = liked ? 'fas fa-heart' : 'far fa-heart';
    } catch(e) {}
}

async function toggleNPFavorite() {
    const song = window._eva.current || SONG_DATA;
    const btn  = document.getElementById('npLikeBtn');
    await toggleFavorite(song.id, song, btn);
}

// ── Misc ──────────────────────────────────────────────────────
function goBack() {
    if (window.history.length > 1) window.history.back();
    else window.location.href = '/home';
}
function showMoreMenu()   { showToast('More options coming soon!', 'info'); }
function showLyrics()     { showToast('Lyrics coming soon!', 'info'); }
function showSleepTimer() { showToast('Sleep timer coming soon!', 'info'); }
function addToQueue()     {
    const song = window._eva.current || SONG_DATA;
    showToast(`${song.title} added to queue`, 'success');
}
function shareSong() {
    const song = window._eva.current || SONG_DATA;
    if (navigator.share) {
        navigator.share({ title: song.title, text: `${song.title} by ${song.artist}`, url: window.location.href });
    } else {
        navigator.clipboard.writeText(window.location.href).then(() => showToast('🔗 Link copied!', 'success'));
    }
}
function downloadCurrentSong() {
    const song = window._eva.current || SONG_DATA;
    if (!song?.url) { showToast('Download not available', 'error'); return; }
    const a = document.createElement('a');
    a.href = song.url; a.download = (song.title || 'song') + '.mp3'; a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
    showToast('Download started', 'success');
}

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
    playSong(SONG_DATA.id, SONG_DATA);
    checkFavoriteState(SONG_DATA.id);
    window._npUpdateSongUI(SONG_DATA);
});
</script>
