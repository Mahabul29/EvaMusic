{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block extra_css %}
<style>
.player-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
}
.player-page-bg {
    position: fixed;
    inset: -50px;
    background-size: cover;
    background-position: center;
    filter: blur(60px) brightness(0.3);
    transform: scale(1.1);
    z-index: -2;
}
.player-page-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.95) 100%);
    z-index: -1;
}
.player-page-album {
    width: 280px;
    height: 280px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    margin-bottom: 32px;
}
.player-page-album img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.player-page-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    max-width: 90vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.player-page-artist {
    font-size: 16px;
    color: var(--text-secondary);
    margin-bottom: 4px;
}
.player-page-album-name {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
}
.player-page-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 40px;
    background: var(--accent-color);
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
}
.player-page-btn:active { transform: scale(0.97); }
.player-page-back {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
}
</style>
{% endblock %}

{% block content %}
<div class="player-page-bg" style="background-image: url('{{ song.image }}')"></div>
<div class="player-page-overlay"></div>

<div class="player-page">
    <div class="player-page-album">
        <img src="{{ song.image }}" alt="{{ song.title }}" onerror="this.src='/static/images/default-album.png'">
    </div>
    <h1 class="player-page-title">{{ song.title }}</h1>
    <p class="player-page-artist">{{ song.artist }}</p>
    <p class="player-page-album-name">{{ song.album }}</p>

    <button class="player-page-btn" onclick="startPlaying()">
        <i class="fas fa-play"></i> Play Now
    </button>
    <a href="/home" class="player-page-back">
        <i class="fas fa-chevron-left"></i> Back to Home
    </a>
</div>

<script>
    const SONG_DATA = {{ song|tojson }};

    function startPlaying() {
        if (SONG_DATA && SONG_DATA.id) {
            playSong(SONG_DATA.id, SONG_DATA);
            // Auto-expand to full player
            setTimeout(() => expandPlayer(), 300);
        } else {
            showToast('Song not available', 'error');
        }
    }

    // Auto-play on load if URL has stream
    window.addEventListener('load', () => {
        if (SONG_DATA.url || SONG_DATA.audio_url) {
            startPlaying();
        }
    });
</script>
{% endblock %}
