<!-- Similar Songs Section -->
<div class="section-head" id="similarSongsHead" style="display: none; margin-top: 24px;">
    <div class="section-title">More Like This</div>
</div>
<div class="songs-scroll-row" id="similarSongs" style="display: none;">
    <!-- Populated by JS -->
</div>

<script>
// ADD this function to your player page JavaScript
async function loadSimilarSongs() {
    const container = document.getElementById('similarSongs');
    const head = document.getElementById('similarSongsHead');
    if (!container || !head) return;

    // Get current song ID from URL or data attribute
    const songId = window.location.pathname.split('/').pop();
    if (!songId) return;

    try {
        const res = await fetch('/api/similar-songs/' + songId + '?limit=10');
        const data = await res.json();

        if (data && data.length > 0) {
            head.style.display = 'flex';
            container.style.display = 'flex';
            container.innerHTML = data.map(song => renderSongCard(song)).join('');
        }
    } catch (e) {
        console.warn('Similar songs load failed', e);
    }
}

// Call when page loads
document.addEventListener('DOMContentLoaded', () => {
    // Load similar songs after a short delay (let player init first)
    setTimeout(loadSimilarSongs, 1000);
});

// Reuse renderSongCard from home.html or define it here:
function renderSongCard(song) {
    const title  = song.title || song.name || 'Unknown';
    const artist = song.artist || song.primaryArtists || song.singers || '';
    const songId = song.id || song.song_id || '';
    const rawImg = song.image || song.image_url || song.thumbnail || '';

    // Simple placeholder
    const ph = '/static/images/default-album.png';
    const img = rawImg || ph;

    return `
        <div class="song-card" onclick="playSong('${songId}', '${escapeHtml(title)}', '${escapeHtml(artist)}')">
            <div class="song-thumb">
                <img src="${img}" alt="${escapeHtml(title)}" loading="lazy"
                     onerror="this.onerror=null;this.src='${ph}'">
                <button class="play-btn"><i class="fas fa-play"></i></button>
            </div>
            <div class="song-info">
                <div class="song-title">${escapeHtml(title)}</div>
                <div class="song-artist">${escapeHtml(artist)}</div>
            </div>
        </div>
    `;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}
</script>
