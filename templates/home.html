<script>
// REPLACE the loadBecauseYouLiked function with this:
    async function loadBecauseYouLiked() {
        const container = document.getElementById('section-because-liked');
        const head = document.getElementById('becauseYouLikedHead');
        if (!container || !head) return;

        try {
            // Try to get suggestions based on taste
            const res = await fetch(`/api/suggestions${langParam(currentLang)}&limit=8`);
            const data = await res.json();

            // FIXED: Show even with 1+ songs, not requiring 4
            if (data && data.length > 0) {
                head.style.display = 'flex';
                container.style.display = 'flex';
                container.innerHTML = data.map(renderSongCard).join('');
            } else {
                // Fallback: show trending songs as "Recommended For You"
                const res2 = await fetch(`/api/trending${langParam(currentLang)}&limit=8`);
                const data2 = await res2.json();
                if (data2 && data2.length > 0) {
                    head.style.display = 'flex';
                    container.style.display = 'flex';
                    // Change title to show it's for new users
                    head.querySelector('.section-title').textContent = 'Recommended For You';
                    container.innerHTML = data2.map(renderSongCard).join('');
                } else {
                    head.style.display = 'none';
                    container.style.display = 'none';
                }
            }
        } catch (e) {
            head.style.display = 'none';
            container.style.display = 'none';
        }
    }

// REPLACE the loadArtists function with this:
    async function loadArtists() {
        const container = document.getElementById('section-artists');
        if (!container) return;
        container.innerHTML = renderSkeletonArtists(6);
        try {
            // Get taste-based artists from API
            const res = await fetch(`/api/artists${langParam(currentLang)}&limit=10`);
            const data = await res.json();
            if (data && data.length > 0) {
                container.innerHTML = data.map(renderArtistCard).join('');
            } else {
                container.innerHTML = `<div class="empty-state" style="width:100%;"><i class="fas fa-users"></i><p>No artists found</p></div>`;
            }
        } catch (e) {
            console.warn('Artists load failed', e);
            container.innerHTML = renderSkeletonArtists(6);
        }
    }
</script>
